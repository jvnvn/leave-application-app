<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — Leave Management System</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch.png">
<meta name="theme-color" content="#0F172A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Aurora Leave">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/employee.css">
<style>
.login-wrap { max-width: 420px; margin: 0 auto; padding: 40px 16px; min-height: 100vh; min-height: 100dvh; }
</style>
</head>
<body>
<main class="login-wrap">
  <p class="sec-label">Leave Management System</p>
  <h1 style="margin:0 0 20px">Sign in</h1>
  <div class="card" style="padding:20px">
    <div id="login-error" class="state-box" role="alert" aria-live="assertive" style="display:none;color:var(--danger);padding:0 0 12px"></div>
    <form id="login-form">
      <label class="sec-label" for="email">Email</label>
      <input class="field ow" id="email" type="email" autocomplete="username" required style="margin-bottom:12px">
      <label class="sec-label" for="password">Password</label>
      <input class="field" id="password" type="password" autocomplete="current-password" required style="margin-bottom:16px">
      <button class="btn btn-primary" id="login-btn" type="submit" style="width:100%">Sign in</button>
    </form>
    <p style="text-align:center"><button class="btn btn-ghost btn-sm" id="forgot-btn" type="button">Forgot password?</button></p>
    <p style="text-align:center;margin:0"><a class="btn btn-ghost btn-sm" href="download.html">Get the Android app</a></p>
  </div>
</main>
<script type="module" src="js/pages/login.js"></script>
<script type="module" src="js/pwa.js"></script>
</body>
</html>
